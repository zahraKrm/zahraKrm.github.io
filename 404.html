<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Zahra Karami</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <!-- Self-contained on purpose: GitHub Pages serves this page for any missing URL,
       so relative links to the stylesheet would break. -->
  <style>
    :root { color-scheme: light dark; --bg: #fbfaf7; --text: #1c2328; --muted: #5f6b73; --accent: #1b3a4b; --on-accent: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e1316; --text: #e5e9eb; --muted: #94a0a7; --accent: #9fc5da; --on-accent: #0e1316; } }
    html, body { height: 100%; }
    body { margin: 0; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text);
           font: 17px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; }
    h1 { margin: 0 0 8px; font: 600 clamp(2rem, 6vw, 3rem)/1.15 Georgia, "Times New Roman", serif; color: var(--accent); }
    p { margin: 0 0 24px; color: var(--muted); }
    a { display: inline-block; padding: 11px 18px; border-radius: 10px; background: var(--accent); color: var(--on-accent);
        font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The page you were looking for doesn’t exist or has moved.</p>
    <a href="/">Go to the homepage</a>
  </main>
</body>
</html>
